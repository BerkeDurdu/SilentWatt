name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          SILENTWATT_TEST_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/postgres

  deploy-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Console image builds
        run: docker build -t silentwatt-console:ci .
      - name: Cloud compose file is valid
        run: |
          printf 'SILENTWATT_SITE=:80\nPOSTGRES_PASSWORD=ci\n' > deploy/.env
          docker compose -f deploy/compose.cloud.yml --profile localdb config --quiet
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Terraform is formatted and valid
        working-directory: deploy/huawei/terraform
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/ml/requirements*.lock
      - run: python -m pip install -r packages/ml/requirements-modeling.lock
      - run: python -m pip install --no-build-isolation -c packages/ml/requirements-modeling.lock -e 'packages/ml[modeling]'
      - run: python -m pip check
      - run: python -m unittest discover -s packages/ml/tests -v
      - run: silentwatt-ml --help
